[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-voice-agentv2"
dynamic = ["version"]
description = "Portfolio realtime voice agent for phone calls (Acme Telco / Ava)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Harold Castro" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "ruff>=0.8.0",
]

[project.urls]
Repository = "https://github.com/haroldcastro-devai/realtime-voice-agentv2"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "rva.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
