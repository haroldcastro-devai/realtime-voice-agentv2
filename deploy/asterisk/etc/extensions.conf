; Extension 1000 answers and bridges 8 kHz AudioSocket to the agent on the host.
; host.docker.internal reaches RVA_AUDIOSOCKET_HOST (127.0.0.1) from the container.

[from-internal]
exten => 1000,1,NoOp(Acme Telco Ava AudioSocket)
 same => n,Answer()
 same => n,AudioSocket(aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa,host.docker.internal:8090)
 same => n,Hangup()
