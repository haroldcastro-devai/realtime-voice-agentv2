; Extension 1000 enters Stasis(rva). The ARI app starts a CallSession then
; continues into [audiosocket] for 8 kHz AudioSocket to the host agent.

[from-internal]
exten => 1000,1,NoOp(Acme Telco Ava ARI)
 same => n,Stasis(rva,aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa)

[audiosocket]
exten => s,1,Answer()
 same => n,ExecIf($["${RVA_AUDIO_SOCKET_UUID}" = ""]?Set(RVA_AUDIO_SOCKET_UUID=aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa))
 same => n,AudioSocket(${RVA_AUDIO_SOCKET_UUID},host.docker.internal:8090)
 same => n,Hangup()

; Fictional Acme outbound (+57 300 000 0xxx). ARI originate uses Local/digits@acme-campaign
; with app=rva (Stasis). This context only answers the Local leg; no dialplan Stasis().
[acme-campaign]
exten => _57300000XXXX,1,NoOp(Acme fictional campaign ${EXTEN})
 same => n,Answer()
 same => n,Wait(600)
