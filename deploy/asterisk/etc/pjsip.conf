; PJSIP for a local softphone. Demo password is not a production secret.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=127.0.0.0/8
external_signaling_address=127.0.0.1
external_media_address=127.0.0.1

[ava]
type=auth
auth_type=userpass
username=ava
password=rva-demo

[ava]
type=aor
max_contacts=1

[ava]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
auth=ava
aors=ava
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
